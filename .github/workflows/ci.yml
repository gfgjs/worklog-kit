# worklog-kit 自身 CI:零运行依赖,无需 npm ci。
# 覆盖 Node 20/22 × ubuntu/windows;只跑测试套件与打包内容清单。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# 最小权限:测试与打包检查只读代码
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm pack --dry-run
